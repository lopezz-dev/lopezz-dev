name: Batallas

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/batallas.py
      - .github/workflows/batallas.yml

permissions:
  contents: write

concurrency:
  group: batallas
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Contribuciones del último año
        env:
          # Con METRICS_TOKEN (un token personal) cuentan también las privadas.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='
            query {
              user(login: "lopezz-dev") {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount } }
                  }
                }
              }
            }' > contrib.json

      - name: Dibuja batallas.svg
        run: python3 scripts/batallas.py contrib.json batallas.svg

      - name: Publica en la rama batallas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && mv batallas.svg out/
          cd out
          git init -q -b batallas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add batallas.svg
          git commit -qm "Actualiza batallas.svg"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" batallas
