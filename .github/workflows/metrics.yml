name: Generate Profile Metrics

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# Two runs committing to the metrics branch at once would fight over it.
concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # isocalendar runs its own contributions query, so it needs no base data.
      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: lopezz-dev
          filename: metrics-calendar.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update ${filename}"
          config_timezone: Europe/Madrid
          config_theme: dark
          plugins_errors_fatal: yes
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Stats card
        uses: lowlighter/metrics@latest
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: lopezz-dev
          filename: metrics-stats.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update ${filename}"
          config_timezone: Europe/Madrid
          config_theme: dark
          plugins_errors_fatal: yes
          # No plugin_lines: since the account rename, contributor stats return
          # author: null for commits under the old noreply emails, and metrics
          # v3.34 crashes on that and hangs until the step times out.
          base: header, repositories
