name: Generate Profile Metrics

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# Two runs committing to the metrics branch at once would fight over it.
concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # isocalendar runs its own contributions query, so it needs no base data.
      - name: Stats card
        uses: lowlighter/metrics@latest
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: lopezz-dev
          filename: metrics-stats.svg
          debug: yes
          output_action: none
          committer_branch: metrics
          committer_message: "Update ${filename}"
          config_timezone: Europe/Madrid
          config_theme: dark
          plugins_errors_fatal: yes
          base: header, repositories
          plugin_lines: yes
          plugin_lines_sections: base
