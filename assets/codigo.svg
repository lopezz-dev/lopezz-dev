fn main() {
    let hoja = Hoja::forjar()
        .sin_atajos()                // 義 rectitud
        .romper_para_aprender()      // 勇 coraje
        .que_otro_pueda_leerlo()     // 仁 compasión
        .si_falla_se_dice()          // 誠 sinceridad
        .firmada(&quot;lopezz-dev&quot;);      // 名誉 honor

    hoja.envainar(); // silenciosa, espera
}"><defs><style>
