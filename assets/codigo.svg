<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Código: 義 rectitud: Sin atajos.; 勇 coraje: Romper para aprender.; 仁 compasión: Código que otro pueda leer.; 礼 respeto: Por quien vino antes.; 誠 sinceridad: Si falla, se dice.; 名誉 honor: Lo firmo con mi nombre.; 忠義 lealtad: Al oficio, no a la moda."><defs><style>
text{font-family:'Courier New',Courier,'DejaVu Sans Mono','Liberation Mono',monospace;fill:#9d968b;white-space:pre}
.t1{fill:#55514b}.t2{fill:#9d968b}.t3{fill:#d9d1c3}.t4{fill:#fbf5ea}
.kj{font-family:'Yu Mincho','Hiragino Mincho ProN','Noto Serif CJK JP','MS Mincho',serif}.sf{font-family:'Cormorant Garamond',Garamond,'Times New Roman',serif;font-style:italic}
