.col text{animation:lit 9.1s ease-out infinite;animation-delay:inherit}
@keyframes sub{0%{opacity:.55}3%{opacity:1}14.3%{opacity:1}20.3%,100%{opacity:.55}}
.sub{opacity:.55;animation:sub 9.1s ease-out infinite}
</style><filter id="soft" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="1.4"/></filter></defs><rect width="1200" height="330" fill="#0b0b0b"/>
